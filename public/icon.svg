<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1322"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded app icon frame -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle outer border -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#10b981" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Glowing background aura -->
  <circle cx="256" cy="256" r="140" fill="#10b981" fill-opacity="0.12" filter="url(#glow)"/>

  <!-- Modern NutriFlow Emblem: Stylized Vitality Leaf & Energy Spark -->
  <g transform="translate(256, 256) scale(1.15)">
    <!-- Base Leaf / Nutrition Shape -->
    <path d="M-10 -110 C60 -100 120 -30 110 50 C100 120 40 140 -20 120 C-90 100 -120 20 -100 -50 C-90 -90 -50 -110 -10 -110 Z" 
          fill="url(#leafGrad)" />
    
    <!-- Inner Leaf Vein Cutout / Dynamic Arc -->
    <path d="M-50 90 C-10 60 40 20 20 -80 C15 -40 -10 10 -40 50 Z" 
          fill="#064e3b" opacity="0.4"/>

    <!-- Energy Flame / Caloric Sparkle -->
    <path d="M5 -15 C20 -45 5 -75 25 -95 C35 -70 55 -50 45 -20 C60 -25 70 -15 65 5 C60 30 35 45 10 35 C-5 30 -5 0 5 -15 Z" 
          fill="url(#flameGrad)" filter="url(#glow)"/>

    <!-- Heart Vitality Pulse Dot -->
    <circle cx="-15" cy="-25" r="12" fill="#ffffff" opacity="0.95"/>
    <circle cx="-35" cy="15" r="7" fill="#a7f3d0" opacity="0.85"/>
  </g>
</svg>
